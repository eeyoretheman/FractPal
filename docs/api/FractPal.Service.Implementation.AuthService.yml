  summary: >-
    Authenticates a user with the provided credentials and issues an access token.

    Sets any necessary cookies or session state via <code class="paramref">context</code>.
  example: []
  syntax:
    content: public Task<LoginResponse> Login(HttpContext context, LoginRequest request)
    parameters:
    - id: context
      type: Microsoft.AspNetCore.Http.HttpContext
      description: The current HTTP context, used to set authentication cookies if applicable.
    - id: request
      type: FractPal.Model.DTO.Auth.LoginRequest
      description: The login credentials containing email and password.
    return:
      type: System.Threading.Tasks.Task{FractPal.Model.DTO.Auth.LoginResponse}
      description: A <xref href="FractPal.Model.DTO.Auth.LoginResponse" data-throw-if-not-resolved="false"></xref> containing the access token and user information.
