  assemblies:
  - FractPal.Service
  namespace: FractPal.Service.Implementation
  summary: >-
    Updates an existing fractal. If the requesting user is not the owner, a forked copy

    is created instead and the original remains unchanged.
  example: []
  syntax:
    content: public Task<FractalDto> UpdateFractalAsync(Guid fractalId, Guid userId, UpdateFractalRequest request)
    parameters:
    - id: fractalId
      type: System.Guid
      description: The unique identifier of the fractal to update.
    - id: userId
      type: System.Guid
      description: The ID of the requesting user.
    - id: request
      type: FractPal.Model.DTO.Fractal.UpdateFractalRequest
      description: The updated fractal configuration data.
    return:
      type: System.Threading.Tasks.Task{FractPal.Model.DTO.Fractal.FractalDto}
      description: >-
        The updated <xref href="FractPal.Model.DTO.Fractal.FractalDto" data-throw-if-not-resolved="false"></xref> if the user is the owner,

        or a new forked <xref href="FractPal.Model.DTO.Fractal.FractalDto" data-throw-if-not-resolved="false"></xref> otherwise.
