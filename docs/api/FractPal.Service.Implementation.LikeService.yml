  assemblies:
  - FractPal.Service
  namespace: FractPal.Service.Implementation
  summary: Toggles the like state for a post by resolving it to its underlying fractal.
  example: []
  syntax:
    content: public Task<bool> ToggleLikePostAsync(Guid postId, Guid userId)
    parameters:
    - id: postId
      type: System.Guid
      description: The unique identifier of the post.
    - id: userId
      type: System.Guid
      description: The ID of the user performing the action.
    return:
      type: System.Threading.Tasks.Task{System.Boolean}
      description: <code>true</code> if the post's fractal is now liked; <code>false</code> if the like was removed.
    content.vb: Public Function ToggleLikePostAsync(postId As Guid, userId As Guid) As Task(Of Boolean)
  overload: FractPal.Service.Implementation.LikeService.ToggleLikePostAsync*
  exceptions:
  - type: System.Collections.Generic.KeyNotFoundException
    commentId: T:System.Collections.Generic.KeyNotFoundException
