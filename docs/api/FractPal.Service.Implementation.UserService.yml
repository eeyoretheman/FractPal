  assemblies:
  - FractPal.Service
  namespace: FractPal.Service.Implementation
  summary: >-
    Toggles the follow relationship from <code class="paramref">followerId</code> to <code class="paramref">followingId</code>.

    If already following, unfollows. If not following, follows.
  example: []
  syntax:
    content: public Task<bool> ToggleFollowAsync(string followerId, string followingId)
    parameters:
    - id: followerId
      type: System.String
      description: The ID of the user initiating the follow/unfollow.
    - id: followingId
      type: System.String
      description: The ID of the user being followed or unfollowed.
    return:
      type: System.Threading.Tasks.Task{System.Boolean}
      description: <code>true</code> if the result is now following; <code>false</code> if unfollowed.
    content.vb: Public Function ToggleFollowAsync(followerId As String, followingId As String) As Task(Of Boolean)
  overload: FractPal.Service.Implementation.UserService.ToggleFollowAsync*
