  summary: Retrieves the profile of a user by their ID.
  example: []
  syntax:
    content: public Task<UserProfileDto> GetProfileAsync(string userId, string currentUserId)
    parameters:
    - id: userId
      type: System.String
      description: The ID of the user whose profile to retrieve.
    - id: currentUserId
      type: System.String
      description: The ID of the requesting user, used to compute <code>IsFollowedByCurrentUser</code>.
    return:
      type: System.Threading.Tasks.Task{FractPal.Model.DTO.User.UserProfileDto}
      description: A <xref href="FractPal.Model.DTO.User.UserProfileDto" data-throw-if-not-resolved="false"></xref> for the requested user.
