  assemblies:
  - FractPal.Service
  namespace: FractPal.Service.Interface
  summary: Updates the content of an existing comment. Only the comment's author may edit it.
  example: []
  syntax:
    content: Task<CommentDto> UpdateComment(Guid userId, Guid commentId, UpdateCommentRequest request)
    parameters:
    - id: userId
      type: System.Guid
      description: The ID of the requesting user.
    - id: commentId
      type: System.Guid
      description: The ID of the comment to update.
    - id: request
      type: FractPal.Model.DTO.Comment.UpdateCommentRequest
      description: The updated comment content.
    return:
      type: System.Threading.Tasks.Task{FractPal.Model.DTO.Comment.CommentDto}
      description: The updated <xref href="FractPal.Model.DTO.Comment.CommentDto" data-throw-if-not-resolved="false"></xref>.
    content.vb: Function UpdateComment(userId As Guid, commentId As Guid, request As UpdateCommentRequest) As Task(Of CommentDto)
  overload: FractPal.Service.Interface.ICommentService.UpdateComment*
  exceptions:
  - type: System.Collections.Generic.KeyNotFoundException
    commentId: T:System.Collections.Generic.KeyNotFoundException
    description: Thrown when no comment exists with <code class="paramref">commentId</code>.
  - type: System.UnauthorizedAccessException
    commentId: T:System.UnauthorizedAccessException
    description: Thrown when the requesting user is not the comment's author.
