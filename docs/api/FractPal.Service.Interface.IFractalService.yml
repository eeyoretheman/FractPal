  assemblies:
  - FractPal.Service
  namespace: FractPal.Service.Interface
  summary: >-
    Creates a copy of an existing fractal under a new owner. The forked fractal

    starts as a draft regardless of the original's publish state.
  example: []
  syntax:
    content: Task<FractalDto> ForkFractalAsync(Guid fractalId, Guid userId)
    parameters:
    - id: fractalId
      type: System.Guid
      description: The unique identifier of the fractal to fork.
    - id: userId
      type: System.Guid
      description: The ID of the user who will own the fork.
    return:
      type: System.Threading.Tasks.Task{FractPal.Model.DTO.Fractal.FractalDto}
      description: The newly created forked <xref href="FractPal.Model.DTO.Fractal.FractalDto" data-throw-if-not-resolved="false"></xref>.
