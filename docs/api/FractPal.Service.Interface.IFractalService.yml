  assemblies:
  - FractPal.Service
  namespace: FractPal.Service.Interface
  summary: Retrieves a paginated feed of all published fractals ordered by most recently published.
  example: []
  syntax:
    content: Task<FractalFeedResponse> GetFeedAsync(Guid userId, int page = 1, int pageSize = 20)
    parameters:
    - id: userId
      type: System.Guid
      description: The ID of the requesting user, used to compute <code>IsLikedByCurrentUser</code>.
    - id: page
      type: System.Int32
      description: The 1-based page number.
    - id: pageSize
      type: System.Int32
      description: The maximum number of fractals to return per page.
    return:
      type: System.Threading.Tasks.Task{FractPal.Model.DTO.Fractal.FractalFeedResponse}
      description: A <xref href="FractPal.Model.DTO.Fractal.FractalFeedResponse" data-throw-if-not-resolved="false"></xref> containing fractals and pagination metadata.
    content.vb: Function GetFeedAsync(userId As Guid, page As Integer = 1, pageSize As Integer = 20) As Task(Of FractalFeedResponse)
