  assemblies:
  - FractPal.Service
  namespace: FractPal.Service.Interface
  summary: Toggles the like state for a fractal by the specified user.
  example: []
  syntax:
    content: Task<bool> ToggleLikeAsync(Guid fractalId, Guid userId)
    parameters:
    - id: fractalId
      type: System.Guid
      description: The unique identifier of the fractal.
    - id: userId
      type: System.Guid
      description: The ID of the user performing the action.
    return:
      type: System.Threading.Tasks.Task{System.Boolean}
      description: <code>true</code> if the fractal is now liked; <code>false</code> if the like was removed.
    content.vb: Function ToggleLikeAsync(fractalId As Guid, userId As Guid) As Task(Of Boolean)
  overload: FractPal.Service.Interface.ILikeService.ToggleLikeAsync*
  exceptions:
  - type: System.Collections.Generic.KeyNotFoundException
    commentId: T:System.Collections.Generic.KeyNotFoundException
    description: Thrown when no fractal exists with <code class="paramref">fractalId</code>.
