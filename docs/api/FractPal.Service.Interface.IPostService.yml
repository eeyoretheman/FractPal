  assemblies:
  - FractPal.Service
  namespace: FractPal.Service.Interface
  summary: Retrieves a paginated feed of all posts, ordered by most recently created.
  example: []
  syntax:
    content: Task<PostFeedResponse> GetFeedAsync(Guid userId, int page = 1, int pageSize = 20)
    parameters:
    - id: userId
      type: System.Guid
      description: The ID of the requesting user, used to compute <code>IsLikedByCurrentUser</code>.
    - id: page
      type: System.Int32
      description: The 1-based page number.
    - id: pageSize
      type: System.Int32
      description: The maximum number of posts to return per page.
    return:
      type: System.Threading.Tasks.Task{FractPal.Model.DTO.Post.PostFeedResponse}
      description: A <xref href="FractPal.Model.DTO.Post.PostFeedResponse" data-throw-if-not-resolved="false"></xref> containing posts and pagination metadata.
