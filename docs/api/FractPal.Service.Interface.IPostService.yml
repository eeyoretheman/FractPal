  assemblies:
  - FractPal.Service
  namespace: FractPal.Service.Interface
  summary: Publishes a fractal as a post. Only the fractal's owner may publish it.
  example: []
  syntax:
    content: Task<PostDto> PublishFractalAsync(Guid fractalId, Guid userId, CreatePostRequest request)
    parameters:
    - id: fractalId
      type: System.Guid
      description: The unique identifier of the fractal to publish.
    - id: userId
      type: System.Guid
      description: The ID of the requesting user.
    - id: request
      type: FractPal.Model.DTO.Post.CreatePostRequest
      description: The post metadata including name and description.
    return:
      type: System.Threading.Tasks.Task{FractPal.Model.DTO.Post.PostDto}
      description: The newly created <xref href="FractPal.Model.DTO.Post.PostDto" data-throw-if-not-resolved="false"></xref>.
    content.vb: Function PublishFractalAsync(fractalId As Guid, userId As Guid, request As CreatePostRequest) As Task(Of PostDto)
  overload: FractPal.Service.Interface.IPostService.PublishFractalAsync*
  exceptions:
  - type: System.Collections.Generic.KeyNotFoundException
    commentId: T:System.Collections.Generic.KeyNotFoundException
    description: Thrown when no fractal exists with <code class="paramref">fractalId</code>.
  - type: System.UnauthorizedAccessException
    commentId: T:System.UnauthorizedAccessException
    description: Thrown when the requesting user is not the fractal's owner.
