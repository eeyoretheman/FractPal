    id: ToggleFollowAsync
    path: ../backend/FractPal.Service/Interface/IUserService.cs
    startLine: 35
  assemblies:
  - FractPal.Service
  namespace: FractPal.Service.Interface
  summary: >-
    Toggles the follow relationship from <code class="paramref">followerId</code> to <code class="paramref">followingId</code>.

    If already following, unfollows. If not following, follows.
  example: []
  syntax:
    content: Task<bool> ToggleFollowAsync(string followerId, string followingId)
    parameters:
    - id: followerId
      type: System.String
      description: The ID of the user initiating the follow/unfollow.
    - id: followingId
      type: System.String
      description: The ID of the user being followed or unfollowed.
    return:
      type: System.Threading.Tasks.Task{System.Boolean}
      description: <code>true</code> if the result is now following; <code>false</code> if unfollowed.
    content.vb: Function ToggleFollowAsync(followerId As String, followingId As String) As Task(Of Boolean)
  overload: FractPal.Service.Interface.IUserService.ToggleFollowAsync*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Thrown when a user attempts to follow themselves.
  nameWithType.vb: IUserService.ToggleFollowAsync(String, String)
  fullName.vb: FractPal.Service.Interface.IUserService.ToggleFollowAsync(String, String)
  name.vb: ToggleFollowAsync(String, String)
