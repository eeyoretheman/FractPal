    startLine: 44
  assemblies:
  - FractPal.Service
  namespace: FractPal.Service.Interface
  summary: >-
    Searches for users whose usernames contain the given query string (case-insensitive).

    Returns up to 20 results.
  example: []
  syntax:
    content: Task<List<UserSearchDto>> SearchUsersAsync(string query, string currentUserId)
    parameters:
    - id: query
      type: System.String
      description: The search term to match against usernames.
    - id: currentUserId
      type: System.String
      description: The ID of the requesting user, used to compute <code>IsFollowedByCurrentUser</code>.
    return:
      type: System.Threading.Tasks.Task{System.Collections.Generic.List{FractPal.Model.DTO.User.UserSearchDto}}
      description: A list of up to 20 matching <xref href="FractPal.Model.DTO.User.UserSearchDto" data-throw-if-not-resolved="false"></xref>.
    content.vb: Function SearchUsersAsync(query As String, currentUserId As String) As Task(Of List(Of UserSearchDto))
